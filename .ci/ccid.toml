schema = 1
project = "cstore"

[checks.rust]
kind = "cargo"
actions = ["fmt", "test", "clippy"]
all_features = true
toolchain = "system"

[checks.core]
kind = "commands"
commands = [["cargo", "check", "--locked", "--no-default-features"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"]]

[checks.resolve]
kind = "commands"
commands = [["bash", ".ci/resolve.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"]]

[checks.typescript-resolve]
kind = "commands"
commands = [["npm", "install", "--package-lock-only", "--ignore-scripts"]]
cache_tools = [["node", "--version"], ["npm", "--version"]]

[checks.typescript]
kind = "commands"
commands = [["npm", "ci", "--ignore-scripts"], ["npm", "run", "check"], ["npm", "test"]]
cache_tools = [["node", "--version"], ["npm", "--version"]]

[render]
tool_revision = "78a4e05b4e1cb25aaeba3966951564d74277bcbd"

[jobs.verify]
scheduler = "crow"
checks = ["rust", "core"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]
